<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Part (QR Code)</title>
    
    <!-- Pustaka Eksternal -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#1e293b',        /* Slate 800 */
                        muted: '#64748b',      /* Slate 500 */
                        polytronRed: '#d32f2f',/* Merah Polytron */
                        polytronDark: '#1e293b',/* Biru Dongker Header */
                        success: '#059669',    /* Hijau Tombol */
                        blueBtn: '#2563eb',    /* Biru Tombol Detail */
                        yellowBtn: '#f59e0b',  /* Kuning Tombol Tambah */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --page-width: 297mm;
            --page-height: 210mm;
            --margin-x: 5mm;
            --margin-y: 5mm;
            
            /* Grid Config: 4 Kolom x 12 Baris */
            --cols: 4;
            --rows: 12;
            
            --gap-x: 2mm;
            --gap-y: 1.2mm;
            
            /* UKURAN QR CODE */
            --qr-size: 12mm; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Latar abu terang khas enterprise */
            min-height: 100vh;
            color: #1e293b;
            position: relative;
            overflow-x: hidden;
        }
        
        .a4-paper {
            width: var(--page-width);
            height: var(--page-height);
            max-width: 100%;
            aspect-ratio: 297 / 210;
            background: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin: 20px 0;
            padding: var(--margin-y) var(--margin-x);
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        
        /* Garis merah di atas kertas A4 */
        .a4-paper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: #d32f2f; 
        }
        
        /* GRID SYSTEM: 4 Cols x 12 Rows */
        .labels-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: var(--gap-y) var(--gap-x);
            height: 100%;
        }

        .label-card {
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            width: 100%;
            height: 100%;
            position: relative;
            background: #ffffff;
            transition: all 0.2s ease;
            display: flex; align-items: center;
            overflow: hidden;
        }
        
        .label-card:hover {
            box-shadow: 0 4px 12px -3px rgba(0, 0, 0, 0.1);
            z-index: 10;
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .label-content { display: flex; width: 100%; height: 100%; align-items: center; padding: 1mm; }
        
        .qr-section {
            width: var(--qr-size);
            height: var(--qr-size);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #fff; border: 0.5px solid #e2e8f0; border-radius: 1px; padding: 0.2mm;
        }
        
        .qr-section img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }

        .text-section {
            flex-grow: 1; padding: 0 2mm;
            display: flex; flex-direction: column; justify-content: center;
            border-left: 1px solid #e2e8f0; margin-left: 1.5mm; height: 100%;
            overflow: hidden; white-space: nowrap;
        }
        
        .upload-zone {
            position: relative; overflow: hidden;
            background: #ffffff;
            border: 2px dashed #94a3b8;
            transition: all 0.3s ease;
        }
        
        .upload-zone:hover { border-color: #d32f2f; background: #fef2f2; }
        .upload-zone.dragover { border-color: #d32f2f; background: #fee2e2; transform: scale(1.01); }

        /* Tombol Hijau (Download PDF) */
        .btn-primary { background: #059669; transition: all 0.3s ease; }
        .btn-primary:hover { background: #047857; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }

        .toast { animation: toastSlide 0.4s ease; }
        @keyframes toastSlide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .label-card { opacity: 0; animation: labelFade 0.3s ease forwards; }
        @keyframes labelFade { from { opacity: 0; } to { opacity: 1; } }
        
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .a4-paper { box-shadow: none; margin: 0; padding: var(--margin-y) var(--margin-x); width: 297mm; height: 210mm; border: none; }
            .a4-paper::before { display: none; }
        }
        
        @media (max-width: 900px) {
            .a4-paper { transform: scale(0.55); transform-origin: top center; margin-bottom: -450px; }
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-8 relative">
    
    <!-- Header UI: Dark Slate & Red Accent -->
    <header class="no-print w-full max-w-5xl mb-6 relative z-10">
        <div class="bg-polytronDark rounded-lg shadow-lg overflow-hidden flex flex-col md:flex-row justify-between items-center p-4 border-b-4 border-polytronRed">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-white rounded flex items-center justify-center shadow">
                    <svg class="w-6 h-6 text-polytronRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-sans text-xl font-bold text-white tracking-wide uppercase">Sistem Otomatis Cetak Label QR Code</h1>
                    <p class="text-sm text-slate-300">Label No. Gudang & Nama Sparepart (QR)</p>
                </div>
            </div>
            <div class="flex items-center gap-3 mt-4 md:mt-0">
                <span class="text-sm text-slate-300">Halo, <strong class="text-white">Administrator</strong></span>
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center border border-slate-500">
                    <svg class="w-5 h-5 text-slate-300" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Control Section -->
    <section class="no-print w-full max-w-5xl mb-6 relative z-10">
        <div class="flex flex-col sm:flex-row gap-4 bg-white p-5 rounded-lg shadow-sm border border-slate-200">
            <div class="upload-zone flex-1 rounded-lg p-6 text-center cursor-pointer" id="upload-zone">
                <input type="file" id="file-input-1" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <div class="pointer-events-none relative z-1">
                    <svg class="w-8 h-8 mx-auto mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <strong class="block text-sm font-semibold text-slate-700">Upload File Excel</strong>
                    <p class="text-xs text-slate-500 mt-1">Format kolom: Part, Deskripsi, Qty</p>
                </div>
            </div>
            
            <div class="flex flex-col gap-3 justify-center min-w-[160px]">
                <button id="btn-clear-1" class="hidden px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-md font-semibold text-sm hover:bg-slate-50 transition-all" onclick="clearData()">
                    Reset Data
                </button>
                <button id="btn-download-1" disabled class="btn-primary px-4 py-3 text-white rounded-md font-semibold text-sm disabled:opacity-40" onclick="generatePDF()">
                    Download PDF
                </button>
            </div>
        </div>
        <div class="flex justify-between items-center mt-3 px-2 text-sm text-slate-600 font-medium">
             <span id="label-count-1">0 Label Terdeteksi</span>
             <span>Ukuran Kertas: A4 Landscape</span>
        </div>
    </section>
    
    <!-- Preview Area -->
    <div class="a4-paper relative z-10 overflow-hidden">
        <div class="labels-container" id="labels-container-1">
            <div class="col-span-full row-span-full flex items-center justify-center h-full text-slate-400 text-sm border-2 border-dashed border-slate-300 rounded-lg bg-slate-50">
                <div class="text-center p-4">
                    <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Silakan Upload File Excel untuk melihat pratinjau<br>
                    <span class="text-xs mt-2 block opacity-70">( By : Gregorius Berlin )</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

<script>
    // === STATE ===
    let labelsToPrint = [];
    
    // === PDF CONFIG (4 Cols x 12 Rows) ===
    const PDF_CFG = {
        orientation: 'l', 
        unit: 'mm',
        format: 'a4',
        pageWidth: 297,
        pageHeight: 210,
        marginX: 5,
        marginY: 5,
        cols: 4,
        rows: 12,
        gapX: 2,
        gapY: 1.2,
        qrSize: 12,
        fontSizePart: 9,
        fontSizeDesc: 5.5
    };
    
    // === FILE HANDLING ===
    document.getElementById('file-input-1').addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });
    
    const uploadZone = document.getElementById('upload-zone');
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault(); uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                if (json.length === 0) throw new Error("File kosong");
                processData(json);
                showToast(`Berhasil memuat ${json.length} baris data`, 'success');
            } catch (err) {
                showToast('Gagal membaca file: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    }
    
    function processData(json) {
        const data = json.map((row, idx) => {
            const findKey = (keys) => {
                const k = Object.keys(row).find(key => keys.includes(key.toLowerCase().trim()));
                return k ? row[k] : "";
            };
            return {
                id: idx,
                part: findKey(['part', 'part number', 'kode', 'code', 'id', 'pn']) || 'N/A',
                desc: findKey(['deskripsi', 'description', 'desc', 'nama', 'name']) || '-',
                qty: findKey(['qty', 'quantity', 'jumlah', 'stock']) || '1'
            };
        });
        
        const labels = [];
        data.forEach(item => {
            let q = parseInt(item.qty);
            if (isNaN(q) || q < 1) q = 1;
            for (let i = 0; i < q; i++) labels.push({ ...item });
        });
        
        labelsToPrint = labels;
        renderLabels();
    }
    
    function clearData() {
        labelsToPrint = [];
        document.getElementById('file-input-1').value = '';
        renderLabels();
        showToast('Data berhasil direset', 'success');
    }
    
    // === RENDER LABELS ===
    function renderLabels() {
        const container = document.getElementById('labels-container-1');
        const countBadge = document.getElementById('label-count-1');
        const btnClear = document.getElementById('btn-clear-1');
        const btnDownload = document.getElementById('btn-download-1');
        
        if (labelsToPrint.length === 0) {
            container.innerHTML = `<div class="col-span-full row-span-full flex items-center justify-center h-full text-slate-400 text-sm border-2 border-dashed border-slate-300 rounded-lg bg-slate-50"><div class="text-center p-4"><svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Upload file Excel untuk melihat pratinjau</div></div>`;
            btnDownload.disabled = true;
            btnClear.classList.add('hidden');
            countBadge.textContent = '0 Label Terdeteksi';
            return;
        }
        
        btnDownload.disabled = false;
        btnClear.classList.remove('hidden');
        countBadge.textContent = `${labelsToPrint.length} Label Siap Cetak`;
        
        container.innerHTML = '';
        
        const displayLimit = 48; 
        const dataToRender = labelsToPrint.slice(0, displayLimit);
        
        dataToRender.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'label-card';
            el.style.animationDelay = `${index * 15}ms`;
            el.innerHTML = `
                <div class="label-content">
                    <div class="qr-section"><img src="${generateQRDataURL(item.part, 3)}" alt="QR"></div>
                    <div class="text-section">
                        <div class="font-mono font-bold text-[11px] text-slate-800 truncate leading-tight">${escapeHtml(item.part)}</div>
                        <div class="text-[6.5px] text-slate-500 truncate mt-1 leading-tight">${escapeHtml(item.desc)}</div>
                    </div>
                </div>`;
            container.appendChild(el);
        });
        
        if (labelsToPrint.length > displayLimit) {
            showToast(`Menampilkan 48 dari ${labelsToPrint.length} label. Download PDF untuk semua.`, 'info');
        }
    }
    
    // === GENERATE PDF ===
    function generatePDF() {
        if (!labelsToPrint.length) return;
        showToast('Sedang membuat PDF...', 'info');
        
        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ 
                orientation: PDF_CFG.orientation, 
                unit: PDF_CFG.unit, 
                format: PDF_CFG.format 
            });
            
            const cfg = PDF_CFG;
            
            const usableW = cfg.pageWidth - (2 * cfg.marginX);
            const usableH = cfg.pageHeight - (2 * cfg.marginY);
            
            const labelW = (usableW - ((cfg.cols - 1) * cfg.gapX)) / cfg.cols;
            const labelH = (usableH - ((cfg.rows - 1) * cfg.gapY)) / cfg.rows;
            
            let colIdx = 0;
            let rowIdx = 0;

            labelsToPrint.forEach((item, i) => {
                if (rowIdx >= cfg.rows) {
                    doc.addPage();
                    rowIdx = 0;
                    colIdx = 0;
                }
                
                const x = cfg.marginX + (colIdx * (labelW + cfg.gapX));
                const y = cfg.marginY + (rowIdx * (labelH + cfg.gapY));
                
                doc.setDrawColor(0);
                doc.setLineWidth(0.2);
                doc.rect(x, y, labelW, labelH);
                
                const qr = qrcode(0, 'L');
                qr.addData(item.part);
                qr.make();
                
                const moduleCount = qr.getModuleCount();
                const cellSize = cfg.qrSize / moduleCount;
                const qrX = x + 1.5;
                const qrY = y + (labelH - cfg.qrSize) / 2;
                
                doc.setFillColor(0, 0, 0);
                for (let r = 0; r < moduleCount; r++) {
                    for (let c = 0; c < moduleCount; c++) {
                        if (qr.isDark(r, c)) {
                            doc.rect(qrX + c * cellSize, qrY + r * cellSize, cellSize, cellSize, 'F');
                        }
                    }
                }
                
                doc.setDrawColor(200, 200, 200);
                doc.setLineWidth(0.1);
                doc.line(x + cfg.qrSize + 2.5, y + 1, x + cfg.qrSize + 2.5, y + labelH - 1);
                
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(cfg.fontSizePart); 
                doc.setTextColor(0);
                doc.text(item.part, x + cfg.qrSize + 4, y + labelH/2 - 0.5);
                
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(cfg.fontSizeDesc); 
                doc.setTextColor(100);
                doc.text(item.desc.substring(0, 50), x + cfg.qrSize + 4, y + labelH/2 + 2);
                
                colIdx++;
                if (colIdx >= cfg.cols) {
                    colIdx = 0;
                    rowIdx++;
                }
            });
            
            doc.save(`Label_QR_Sparepart_${new Date().toISOString().slice(0, 10)}.pdf`);
            showToast('PDF berhasil diunduh!', 'success');
        }, 100);
    }
    
    // === UTILITIES ===
    function generateQRDataURL(text, size) {
        const qr = qrcode(0, 'L');
        qr.addData(text);
        qr.make();
        return qr.createDataURL(size, 0);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }
    
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = { 
            success: 'bg-emerald-600', 
            error: 'bg-red-600', 
            info: 'bg-slate-700' 
        };
        toast.className = `toast ${colors[type]} text-white px-5 py-3 rounded-md shadow-lg text-sm flex items-center gap-2 font-medium`;
        toast.innerHTML = `<span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
    }
</script>

</body>
</html>
